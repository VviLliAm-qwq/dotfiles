<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fira Sans 走 weak 兜底，避免与 60-lanrhyme-fonts.conf 的全局设定冲突 -->
  <alias binding="weak">
    <family>Fira Sans</family>
    <prefer>
      <family>Source Han Sans CN</family>
    </prefer>
  </alias>
</fontconfig>
