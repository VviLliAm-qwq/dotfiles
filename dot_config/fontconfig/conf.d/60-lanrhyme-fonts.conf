<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    LanRhyme 全局字体方案
    西文主字体：JetBrains Mono Nerd Font
    中文主字体：Source Han Sans CN（思源黑体 CN）
    等宽场景：   JetBrainsMono Nerd Font Mono + Source Han Sans CN 兜底
    设计要点：
      1 强绑定(prepend)的家族优先，故把中文字体按语言判定后放在前面
      2 中文缺字时回落到思源黑体各字重，最终兜底 Noto Sans CJK SC
      3 显式修正 fc-match sans-serif 曾错误落到 Noto Sans CJK KR 的问题
  -->

  <!-- ========== 语言相关的字形修正：中文一律优先简体字形 ========== -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test name="family" compare="contains">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Source Han Sans CN</string>
    </edit>
  </match>

  <!-- ========== sans-serif：英文 JetBrains Mono + 中文思源黑体 ========== -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Source Han Sans CN</family>
    </prefer>
  </alias>

  <!-- ========== serif：英文保持衬线，中文走思源宋体 ========== -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- ========== monospace：等宽版 JetBrains Mono，中文思源黑体兜底 ========== -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Source Han Sans CN</family>
    </prefer>
  </alias>

  <!-- ========== 通用兜底：任何字体找不到字形时，按顺序回落 ========== -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Source Han Sans CN</string>
    </edit>
  </match>

  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ========== 中文语言族显式指定，防止落到日韩字形 ========== -->
  <alias binding="strong">
    <family>Source Han Sans SC</family>
    <prefer>
      <family>Source Han Sans CN</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>思源黑体</family>
    <prefer>
      <family>Source Han Sans CN</family>
    </prefer>
  </alias>
</fontconfig>
